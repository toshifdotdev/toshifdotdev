<svg width="854" height="320" viewBox="0 0 854 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DMARC Harbor: DMARC monitoring for MSPs and agencies, live at dmarcharbor.com">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1013"/>
      <stop offset="1" stop-color="#14181E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F5FD6"/>
      <stop offset="1" stop-color="#13A050"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#1F5FD6" stop-opacity="0.22"/><stop offset="1" stop-color="#1F5FD6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity="0.05"/></pattern>
    <clipPath id="frame"><rect width="854" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="854" height="320" fill="url(#bg)"/>
    <rect width="854" height="320" fill="url(#dots)"/>
    <circle cx="120" cy="20" r="240" fill="url(#glow)"/>
    <rect width="854" height="4" fill="url(#accent)"/>
