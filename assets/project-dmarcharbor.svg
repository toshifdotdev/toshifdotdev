  <text x="107" y="80" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#8B949E">EMAIL TRUST, SAFELY MOORED</text>
  <g transform="translate(370 38)"><rect x="-63" y="0" width="63" height="22" rx="11" fill="#3FB950" fill-opacity="0.12" stroke="#3FB950" stroke-opacity="0.45"/><circle cx="-50" cy="11" r="3.5" fill="#3FB950"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="-50" cy="11" r="3.5" fill="none" stroke="#3FB950"><animate attributeName="r" values="3.5;8" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/></circle><text x="-23.0" y="15" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#3FB950">LIVE</text></g><g transform="translate(468 38)"><rect x="-79" y="0" width="79" height="22" rx="11" fill="#58A6FF" fill-opacity="0.12" stroke="#58A6FF" stroke-opacity="0.45"/><text x="-39.5" y="15" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#58A6FF">FLAGSHIP</text></g>
  <text x="36" y="124" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#C9D1D9">A multi-tenant DMARC monitoring SaaS for MSPs and</text><text x="36" y="146" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#C9D1D9">agencies. Ingests aggregate &amp; forensic reports, checks</text><text x="36" y="168" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#C9D1D9">SPF · DKIM · DMARC, watches DNS, and walks every client</text><text x="36" y="190" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#C9D1D9">domain safely from p=none to p=reject.</text>
  <rect x="36" y="222" width="67" height="22" rx="11.0" fill="#161B22" stroke="#30363D"/><text x="69.5" y="237.1" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#C9D1D9">Next.js</text><rect x="111" y="222" width="87" height="22" rx="11.0" fill="#161B22" stroke="#30363D"/><text x="154.5" y="237.1" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#C9D1D9">TypeScript</text><rect x="206" y="222" width="67" height="22" rx="11.0" fill="#161B22" stroke="#30363D"/><text x="239.5" y="237.1" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#C9D1D9">Express</text><rect x="281" y="222" width="60" height="22" rx="11.0" fill="#161B22" stroke="#30363D"/><text x="311.0" y="237.1" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#C9D1D9">Prisma</text><rect x="349" y="222" width="87" height="22" rx="11.0" fill="#161B22" stroke="#30363D"/><text x="392.5" y="237.1" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#C9D1D9">PostgreSQL</text><rect x="36" y="252" width="140" height="22" rx="11.0" fill="#161B22" stroke="#30363D"/><text x="106.0" y="267.1" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#C9D1D9">Cloudflare Workers</text><rect x="184" y="252" width="40" height="22" rx="11.0" fill="#161B22" stroke="#30363D"/><text x="204.0" y="267.1" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#C9D1D9">AWS</text><rect x="232" y="252" width="60" height="22" rx="11.0" fill="#161B22" stroke="#30363D"/><text x="262.0" y="267.1" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#C9D1D9">Docker</text><rect x="300" y="252" width="113" height="22" rx="11.0" fill="#161B22" stroke="#30363D"/><text x="356.5" y="267.1" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#C9D1D9">GitHub Actions</text>

  <rect x="540" y="30" width="286" height="262" rx="12" fill="#0A0C0F" stroke="#262B33"/>
