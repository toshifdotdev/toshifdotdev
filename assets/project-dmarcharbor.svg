  <text x="558" y="94" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#C9D1D9">acme.example</text><rect x="739" y="80" width="69" height="19" rx="9.5" fill="#3FB950" fill-opacity="0.14" stroke="#3FB950" stroke-opacity="0.45"/><text x="773.5" y="93.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#3FB950">p=reject</text><rect x="558" y="104" width="250" height="5" rx="2.5" fill="#1C2128"/><rect x="558" y="104" width="0" height="5" rx="2.5" fill="#3FB950"><animate attributeName="width" from="0" to="250" begin="0.3s" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text x="558" y="134" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#C9D1D9">globex.example</text><rect x="713" y="120" width="95" height="19" rx="9.5" fill="#D29922" fill-opacity="0.14" stroke="#D29922" stroke-opacity="0.45"/><text x="760.5" y="133.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#D29922">p=quarantine</text><rect x="558" y="144" width="250" height="5" rx="2.5" fill="#1C2128"/><rect x="558" y="144" width="0" height="5" rx="2.5" fill="#D29922"><animate attributeName="width" from="0" to="165" begin="0.55s" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text x="558" y="174" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#C9D1D9">initech.example</text><rect x="752" y="160" width="56" height="19" rx="9.5" fill="#8B949E" fill-opacity="0.14" stroke="#8B949E" stroke-opacity="0.45"/><text x="780.0" y="173.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#8B949E">p=none</text><rect x="558" y="184" width="250" height="5" rx="2.5" fill="#1C2128"/><rect x="558" y="184" width="0" height="5" rx="2.5" fill="#8B949E"><animate attributeName="width" from="0" to="70" begin="0.8s" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
