  <rect x="0.5" y="0.5" width="853" height="319" rx="18" fill="none" stroke="#2A2F37"/>

  <g transform="translate(36 30) scale(0.109375)"><rect width="512" height="512" rx="112" fill="#15171B" stroke="#3A404A" stroke-width="10"/><rect x="120" y="88" width="84" height="336" rx="18" fill="#1F5FD6"/><rect x="308" y="88" width="84" height="336" rx="18" fill="#13A050"/><path d="M162 252 C 196 206, 236 206, 256 252 C 276 298, 316 298, 350 252" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" fill="none"/></g>
