<svg width="854" height="200" viewBox="0 0 854 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="0.5" stop-color="#203A43"/>
      <stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#79C0FF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="854" height="200" fill="url(#bg)"/>
  <rect width="854" height="200" fill="url(#dots)"/>

  <!-- subtle animated glow -->
  <circle cx="120" cy="40" r="90" fill="#58A6FF" opacity="0.06">
    <animate attributeName="r" values="90;110;90" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="160" r="80" fill="#79C0FF" opacity="0.05">
    <animate attributeName="r" values="80;100;80" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- name -->
  <text x="427" y="92" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF" letter-spacing="6">TOSHIF</text>

  <!-- accent divider -->
  <rect x="337" y="112" width="180" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="427" y="146" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#A8C3D1" letter-spacing="3">FULL-STACK DEVELOPER  ·  MERN  ·  CLOUD &amp; DEVOPS</text>

  <!-- layered animated waves -->
  <path fill="#58A6FF" opacity="0.07">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0 170 Q 213 150 427 170 T 854 170 L 854 200 L 0 200 Z;
              M0 170 Q 213 190 427 170 T 854 170 L 854 200 L 0 200 Z;
              M0 170 Q 213 150 427 170 T 854 170 L 854 200 L 0 200 Z"/>
  </path>
  <path fill="#79C0FF" opacity="0.06">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 180 Q 213 165 427 180 T 854 180 L 854 200 L 0 200 Z;
              M0 180 Q 213 195 427 180 T 854 180 L 854 200 L 0 200 Z;
              M0 180 Q 213 165 427 180 T 854 180 L 854 200 L 0 200 Z"/>
  </path>
</svg>
