<svg width="854" height="260" viewBox="0 0 854 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Toshif, Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1A"/>
      <stop offset="0.55" stop-color="#0F2027"/>
      <stop offset="1" stop-color="#18374A"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#79C0FF"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#58A6FF" stop-opacity="0.35"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#3FB950" stop-opacity="0.18"/><stop offset="1" stop-color="#3FB950" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="854" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="854" height="260" fill="url(#bg)"/>
    <rect width="854" height="260" fill="url(#grid)"/>
    <circle cx="140" cy="40" r="200" fill="url(#g1)">
      <animate attributeName="cx" values="140;220;140" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="250" r="220" fill="url(#g2)">
      <animate attributeName="cy" values="250;200;250" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="0.5" y="0.5" width="853" height="259" rx="18" fill="none" stroke="#30363D"/>

  <text x="46" y="74" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" fill="#58A6FF">// hello world, I'm</text>
  <text x="42" y="138" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="1">Toshif</text>
  <text x="46" y="172" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#C9D1D9">Full-Stack Developer · Cloud &amp; DevOps · India</text>

  <rect x="46" y="196" width="138" height="30" rx="15" fill="#3FB950" fill-opacity="0.1" stroke="#3FB950" stroke-opacity="0.4"/>
  <circle cx="64" cy="211" r="4" fill="#3FB950"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="64" cy="211" r="4" fill="none" stroke="#3FB950"><animate attributeName="r" values="4;9" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="124" y="215.5" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#56D364">Open to work</text>
  <rect x="196" y="196" width="194" height="30" rx="15.0" fill="#58A6FF" fill-opacity="0.1" stroke="#58A6FF" stroke-opacity="0.4"/><text x="293.0" y="215.5" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#79C0FF">Building dmarcharbor.com</text>

  <rect x="480" y="38" width="336" height="186" rx="12" fill="#0D1117" fill-opacity="0.92" stroke="#30363D"/>
  <path d="M480 50a12 12 0 0 1 12-12h312a12 12 0 0 1 12 12v18H480z" fill="#161B22"/>
  <line x1="480" y1="68" x2="816" y2="68" stroke="#30363D"/>
  <circle cx="500" cy="53" r="5.5" fill="#FF5F56"/><circle cx="518" cy="53" r="5.5" fill="#FFBD2E"/><circle cx="536" cy="53" r="5.5" fill="#27C93F"/>
  <text x="648" y="57" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#8B949E">toshif@dev: ~</text>
  <text x="502" y="104" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" fill="#E6EDF3" opacity="0"><tspan fill="#3FB950">$</tspan> whoami<animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.35s" fill="freeze"/></text><text x="502" y="130" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" fill="#E6EDF3" opacity="0"><tspan fill="#8B949E">toshif · full-stack · ts / node / aws</tspan><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.35s" fill="freeze"/></text><text x="502" y="156" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" fill="#E6EDF3" opacity="0"><tspan fill="#3FB950">$</tspan> git push origin main<animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.35s" fill="freeze"/></text><text x="502" y="182" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" fill="#E6EDF3" opacity="0"><tspan fill="#3FB950">✓ deployed</tspan> <tspan fill="#8B949E">→</tspan> <tspan fill="#79C0FF">dmarcharbor.com</tspan><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.35s" fill="freeze"/></text><text x="502" y="208" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" fill="#3FB950" opacity="0">$<animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.2s" fill="freeze"/></text><rect x="516" y="196" width="8" height="15" fill="#E6EDF3" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.5;0.51" dur="1s" begin="3.2s" repeatCount="indefinite"/></rect>
